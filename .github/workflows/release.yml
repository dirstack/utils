name: Release

# Pushing to main never publishes on its own. Pending changesets open or update the
# "Version Packages" pull request. Merging it bumps the version, and the release job then
# publishes that version to npm and creates its GitHub Release. The release job does nothing
# when the version in package.json is already on npm.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    # A manual run can target any branch, so only main may version or publish.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    uses: dirstack/kodeks/.github/workflows/public-version.yml@fad5b9492d76308925f49c49906d2eb0353cc5f3 # v1.10.0
    with:
      bun-version-file: .bun-version

  release:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
    uses: dirstack/kodeks/.github/workflows/public-release.yml@fad5b9492d76308925f49c49906d2eb0353cc5f3 # v1.10.0
    with:
      bun-version-file: .bun-version
      # CI does not run on the "Version Packages" pull request, so check again before publishing.
      build-command: bun run typecheck && bun test && bun run build
